name: diabetes

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - jupyterlab=4.6.0
  - joblib=1.5.3
  - matplotlib=3.11.0
  - numpy=1.26.4
  - pandas=3.0.3
  - scikit-learn=1.9.0
  - scipy=1.17.1
  - seaborn=0.13.2
  - statsmodels=0.14.6

  - pip:
      - Flask==3.1.3
      - keras==3.15.0
      - tensorflow==2.16.2
      - 'tensorflow-metal==1.2.0; sys_platform == "darwin" and platform_machine == "arm64"'
